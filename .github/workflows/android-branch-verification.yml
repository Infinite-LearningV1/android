name: Android Branch Verification

on:
  push:
    branches:
      - develop
      - deploy
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - deploy
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Create local.properties for CI
        shell: bash
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          : > local.properties
          if [ -n "$MAPS_API_KEY" ]; then
            printf 'MAPS_API_KEY=%s\n' "$MAPS_API_KEY" >> local.properties
          fi

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Assemble debug
        run: ./gradlew app:assembleDebug

      - name: Run unit tests
        run: ./gradlew app:test

      - name: Run lint
        run: ./gradlew app:lint

      - name: Release compile smoke check
        run: ./gradlew app:assembleRelease
